name: CI

permissions:
  contents: write   # publish the installer to the "jarvis-latest" pre-release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@v4
        with:
          path: tests/.models
          key: test-models-v1
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  # Voice on a clean Windows machine with real models from HuggingFace:
  # every catalog voice URL, Piper synthesis, Whisper recognition, wake word.
  windows-voice:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: tests/.models
          key: voice-models-v1
      - run: python -m pip install -e ".[dev]"
      - name: All catalog voices exist
        run: |
          python -c "import httpx; from jarvis.voice.models import VOICE_CATALOG, PIPER_REPO, PIPER_REV; bad=[v.id for v in VOICE_CATALOG for ext in ('', '.json') if httpx.head(f'https://huggingface.co/{PIPER_REPO}/resolve/{PIPER_REV}/{v.hf_path}{ext}', follow_redirects=True, timeout=30).status_code != 200]; print('missing:', bad); assert not bad"
      - name: Choose a voice and synthesize (CLI)
        shell: pwsh
        run: |
          python -m jarvis --home "$env:RUNNER_TEMP\jh" voices --set 2
          python -m jarvis --home "$env:RUNNER_TEMP\jh" say "Здравствуйте, меня зовут Джарвис. Сегодня отличная погода." --out "$env:RUNNER_TEMP\t.wav"
          python -m jarvis --home "$env:RUNNER_TEMP\jh" transcribe "$env:RUNNER_TEMP\t.wav" | Tee-Object -Variable out
          if (-not ("$out" -match "погод")) { throw "transcription mismatch: $out" }
      - name: Whisper tests
        run: python -m pytest -q tests/test_voice_whisper.py tests/test_voice_audio.py -v
        env:
          JARVIS_TEST_WHISPER: "1"

  # Real end-to-end run on a clean Windows machine: installer, Ollama, a small
  # real Qwen model on CPU, and a question through the launcher.
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      JARVIS_NO_PAUSE: "1"
      JARVIS_INSTALL_ARGS: "-Yes -Model qwen2.5:0.5b"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama
        shell: pwsh
        run: |
          Invoke-WebRequest https://ollama.com/download/OllamaSetup.exe -OutFile OllamaSetup.exe
          # Wait for the installer process only: -Wait would also wait for the Ollama app it launches.
          $p = Start-Process .\OllamaSetup.exe -ArgumentList '/VERYSILENT','/NORESTART','/SUPPRESSMSGBOXES' -PassThru
          $p.WaitForExit()
          Write-Host "installer exit code: $($p.ExitCode)"
          "$env:LOCALAPPDATA\Programs\Ollama" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: First launch (runs install.ps1) and one question
        shell: cmd
        run: |
          jarvis.bat --model qwen2.5:0.5b ask "Сколько будет 17*23? Ответь одним числом."
      - name: Second launch (already installed) + doctor
        shell: cmd
        run: |
          jarvis.bat --model qwen2.5:0.5b ask "Скажи привет"
          jarvis.bat --model qwen2.5:0.5b chat < NUL
          jarvis.bat --model qwen2.5:0.5b doctor || exit /b 0
      - name: Logs
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:LOCALAPPDATA\JARVIS\logs\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 80
          Get-Content "$env:LOCALAPPDATA\JARVIS\logs\jarvis.log" -ErrorAction SilentlyContinue | Select-Object -Last 80

  # Windows installer: PyInstaller app -> self-check -> Inno Setup -> silent install test -> Releases.
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build app
        shell: pwsh
        run: |
          python -m pip install -e . pyinstaller
          cd packaging
          pyinstaller jarvis.spec --noconfirm
      - name: Check the built app
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $app = "packaging\dist\JARVIS"
          & "$app\jarvis-cli.exe" --version
          & "$app\jarvis-cli.exe" --home "$env:RUNNER_TEMP\fh" say "Проверка установленной версии." --out "$env:RUNNER_TEMP\f.wav"
          if ($LASTEXITCODE -ne 0) { throw "say failed" }
          $p = Start-Process "$app\JARVIS.exe" -ArgumentList "--home","$env:RUNNER_TEMP\fh","gui","--smoke" -PassThru -Wait
          Get-Content "$env:RUNNER_TEMP\fh\logs\jarvis.log" -Tail 5
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = python -c "import jarvis; print(jarvis.__version__)"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging\jarvis.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          Get-ChildItem dist-installer
      - name: Silent install, run, uninstall
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $setup = (Get-ChildItem dist-installer\JARVIS-Setup-*.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "setup failed: $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\JARVIS"
          & "$dir\jarvis-cli.exe" --version
          $g = Start-Process "$dir\JARVIS.exe" -ArgumentList "gui","--smoke" -PassThru -Wait
          if ($g.ExitCode -ne 0) { throw "installed GUI failed" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -PassThru -Wait
          Start-Sleep 3
          if (Test-Path "$dir\JARVIS.exe") { throw "uninstall left files" }
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup
          path: dist-installer/*.exe
      - name: Publish to Releases (jarvis-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-latest
          name: JARVIS (последняя сборка)
          prerelease: true
          files: dist-installer/*.exe
          body: |
            Установщик JARVIS для Windows 10/11 (x64). Скачайте JARVIS-Setup-*.exe, запустите и следуйте мастеру.
            При первом запуске JARVIS сам предложит установить Ollama и скачать модели.
