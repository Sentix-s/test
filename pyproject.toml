[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.3.2"
description = "JARVIS — personal local AI assistant for Windows (local LLM via Ollama)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "psutil>=5.9",
    "rich>=13.7",
    "tzdata>=2024.1; sys_platform == 'win32'",
    # voice
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.14",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    # openWakeWord needs tflite-runtime on Linux, which has no Python 3.12 build (Windows uses ONNX).
    "openwakeword>=0.6; sys_platform == 'win32' or python_version < '3.12'",
    # GUI. PySide6 6.12.0 corrupts the refcount of None on Python 3.11 (interpreter abort),
    # so 3.11 stays below it; Python 3.12 is unaffected.
    "PySide6-Essentials>=6.8,<6.12; python_version < '3.12'",
    "PySide6-Essentials>=6.8; python_version >= '3.12'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# CUDA 12 runtime for faster-whisper on NVIDIA GPUs (Windows). Ollama ships its own CUDA; CTranslate2 does not.
gpu = [
    "nvidia-cublas-cu12>=12.4; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
